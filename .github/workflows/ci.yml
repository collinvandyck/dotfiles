name: CI

on:
  push:
  pull_request:

jobs:
  shell-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships cargo, so `just dr-check` and `just dr-test` run
      # here rather than skipping. Clippy is not in the image, so rustup fetches
      # the toolchain dr/rust-toolchain.toml pins; cache it along with the
      # registry and the target dir the justfile points cargo at.
      - name: Cache Rust toolchain and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dr-target
          key: dr-${{ runner.os }}-${{ hashFiles('dr/Cargo.lock', 'dr/rust-toolchain.toml') }}
          restore-keys: dr-${{ runner.os }}-

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install toolchain from mise
        run: mise install

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh

      - name: Run shell lint and tests
        run: mise exec -- just ci
