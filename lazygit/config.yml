promptToReturnFromSubprocess: false
gui:
  scrollHeight: 6 # how many lines you scroll by
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  mainPanelSplitMode: "flexible"
  border: rounded
  showDivergenceFromBaseBranch: arrowAndNumber
  showPanelJumps: false
  statusPanelView: allBranchesLog
  skipNoStagedFilesWarning: true
  skipRewordInEditorWarning: true
  skipStashWarning: true
  # If not "none", lazygit will automatically forward branches to their upstream after fetching. Applies to branches that are not the currently checked out branch, and only to those that are strictly behind their upstream (as opposed to diverged).
  # Possible values: 'none' | 'onlyMainBranches' | 'allBranches'
  autoForwardBranches: none
  # If true, periodically fetch from remote
  autoFetch: false
  theme:
    # The default is ANSI blue, which Aizen Dark maps to a light pastel (#84b4f8). In the patch view the diff
    # keeps its own red/green foreground, so removed lines land at ~1:1 contrast. A dark bg keeps them legible.
    selectedLineBgColor: ["#38405a"]
    inactiveViewSelectedLineBgColor: ["#262a36"]
os:
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64)\a" > /dev/tty
  edit: 'nvim {{filename}}'
  editAtLine: 'nvim +{{line}} {{filename}}'
  editAtLineAndWait: 'nvim +{{line}} {{filename}}'
git:
  ignoreWhitespaceInDiffView: true
  commit:
    autoWrapCommitMessages: true
    autoWrapWidth: 80
  #branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --pretty=format:"%C(auto)%h %<(15,trunc)%C(blue)%an %C(auto)%d %s %C(147)%ar" {{branchName}} --
  branchLogCmd: git ll --first-parent {{branchName}} --
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
  allBranchesLogCmds:
    - git log --graph --color=always --all --abbrev-commit --decorate --pretty=format:'%C(auto)%h %<(10,trunc)%C(blue)%an %<(14)%C(green)%ar %C(auto)%d %s' --
customCommands:
  - context: 'global'
    key: '<c-s>'
    title: 'zsh shell'
    description: 'Spawn a shell in the current dir'
    command: "zsh || true"
    output: terminal
  - context: 'commits'
    key: '<c-e>'
    title: 'hello'
    command: git reword {{ .SelectedCommit.Hash }}
    output: terminal
  - context: 'files'
    key: 'w'
    title: 'wip'
    command: "git add -A && git commit -m wip || true"
  # Stamp refs/mb at the merge base with origin/main, then `W` -> "Enter ref to diff" -> `mb` to put diff mode in
  # three-dot territory: every commit you select diffs against the merge base instead of against origin/main's tip.
  # Git resolves a bare `mb` via refs/<name>, so the ref stays out of the branches and tags panels. Re-press after a
  # fetch, since the merge base moves when origin/main does.
  - key: '<c-g>'
    context: 'global'
    description: 'Stamp refs/mb at the merge-base with origin/main'
    command: 'git update-ref refs/mb "$(git merge-base origin/main HEAD)"'
    loadingText: 'Finding merge base'
  - key: '<c-f>' # Ctrl-f (think "full screen") to show selected commit
    context: 'commits'
    command: "git -c delta.pager='less -R +g' show {{.SelectedLocalCommit.Sha}}"
    description: "Show selected commit"
    output: terminal
